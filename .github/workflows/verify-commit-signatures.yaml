name: Verify Commit Signatures

on:
  # pull_request_target runs the workflow and the action from the base branch, so a PR cannot alter its own check.
  # This is safe because the job never checks out or executes PR code.
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions: {}

concurrency:
  group: commit-signatures-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-commit-signatures:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      # No ref is set on purpose: under pull_request_target this checks out the base branch, never the PR head.
      - name: Checkout action from base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: verify-commit-signatures

      - name: Check PR commit signatures
        uses: ./verify-commit-signatures
