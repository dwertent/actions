name: Verify Commit Signatures Test
on:
  pull_request:
    paths:
      - "verify-commit-signatures/**"
      - ".github/workflows/verify-commit-signatures-test.yaml"
  push:
    branches: [main]
    paths:
      - "verify-commit-signatures/**"
      - ".github/workflows/verify-commit-signatures-test.yaml"

permissions:
  contents: read

jobs:
  verify-commit-signatures-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run action tests
        run: bash verify-commit-signatures/verify_test.sh
